name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Migrate Matcha Infused nomenclature to Taro Flavoured
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -d src/main/resources/assets/matchainfused ] && [ ! -d src/main/resources/data/matchainfused ] && [ ! -d src/main/java/org/violeterra/matchainfused ]; then
            echo "Nomenclature already migrated."
            exit 0
          fi

          git mv src/main/resources/assets/matchainfused src/main/resources/assets/taroflavoured
          git mv src/main/resources/data/matchainfused src/main/resources/data/taroflavoured
          git mv src/main/java/org/violeterra/matchainfused src/main/java/org/violeterra/taroflavoured
          git mv src/main/java/org/violeterra/taroflavoured/MatchaInfused.java src/main/java/org/violeterra/taroflavoured/TaroFlavoured.java

          find . -type f -not -path './.git/*' -print0 \
            | xargs -0 grep -Il -e 'matchainfused' -e 'MatchaInfused' -e 'Matcha Infused' -e 'Matcha Flavoured' \
            | xargs -r sed -i \
              -e 's/matchainfused/taroflavoured/g' \
              -e 's/MatchaInfused/TaroFlavoured/g' \
              -e 's/Matcha Infused/Taro Flavoured/g' \
              -e 's/Matcha Flavoured/Taro Flavoured/g'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Matcha Infused namespace to Taro Flavoured"
          git push
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: taro-build
          path: build/libs/*.jar
