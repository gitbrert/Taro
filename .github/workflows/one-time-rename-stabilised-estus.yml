name: One-time Estus rename

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    if: "!contains(github.event.head_commit.message, 'Rename Stabilised Estus to Evil Eye')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename every Estus occurrence
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\\0")
          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new_text = text.replace("stabilised_estus", "evil_eye").replace("Stabilised Estus", "Evil Eye")
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.exists() and "stabilised_estus" in path.name:
                  path.rename(path.with_name(path.name.replace("stabilised_estus", "evil_eye")))

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-rename-stabilised-estus.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rename Stabilised Estus to Evil Eye"
          git push
